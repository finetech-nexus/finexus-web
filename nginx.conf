# Finexus marketing site (Vite SPA)
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  port_in_redirect off;

  location /health {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ~ ^/downloads/nexus-bank(-[0-9.]+)?\.apk$ {
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="nexus-bank.apk"';
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
