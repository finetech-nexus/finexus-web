# Finexus marketing site: build, Docker image, Helm chart (OCI).
# Repo root must be finexus-web (https://github.com/finetech-nexus/finexus-web).

name: CI

on:
  push:
    branches: [develop, main, master]
  pull_request:
    branches: [develop, main, master]
  workflow_dispatch:

concurrency:
  group: finexus-web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: finexus-web
  DOCKER_ORGANIZATION: ${{ vars.DOCKER_ORGANIZATION || 'nexusbank' }}
  CHART_PATH: helm/finexus-web
  OCI_REGISTRY: ${{ vars.OCI_REGISTRY == '' && 'ghcr.io' || vars.OCI_REGISTRY }}
  OCI_REPO: ${{ vars.OCI_CHART_REPO == '' && format('{0}/finexus-web', github.repository_owner) || vars.OCI_CHART_REPO }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

  push-image:
    name: Build and push image
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_ORGANIZATION }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_ORGANIZATION }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-helm:
    name: Package and push Helm chart
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"
      - name: Enable Helm OCI
        run: echo "HELM_EXPERIMENTAL_OCI=1" >> "$GITHUB_ENV"
      - name: Package chart
        id: package
        run: |
          mkdir -p ./out
          helm package ${{ env.CHART_PATH }} --destination ./out
          CHART_TGZ=$(ls ./out/*.tgz)
          echo "chart_tgz=${CHART_TGZ}" >> "$GITHUB_OUTPUT"
      - name: Log in to OCI registry (GHCR)
        if: env.OCI_REGISTRY == 'ghcr.io'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Log in to OCI registry (other)
        if: env.OCI_REGISTRY != 'ghcr.io'
        env:
          OCI_USERNAME: ${{ secrets.OCI_REGISTRY_USERNAME }}
          OCI_PASSWORD: ${{ secrets.OCI_REGISTRY_PASSWORD }}
        run: |
          echo "$OCI_PASSWORD" | helm registry login ${{ env.OCI_REGISTRY }} -u "$OCI_USERNAME" --password-stdin
      - name: Push chart to OCI
        run: |
          helm push ${{ steps.package.outputs.chart_tgz }} oci://${{ env.OCI_REGISTRY }}/${{ env.OCI_REPO }}
